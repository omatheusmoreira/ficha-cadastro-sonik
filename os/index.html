                <button class="tab-button" data-page="2">

                </button>
                <button class="tab-button" data-page="3">

                        <option value="leticia-oliveira">Letícia Oliveira</option>
                        <option value="lorena-fonseca">Lorena Fonseca</option>
                        <option value="ludmila-camargos">Ludmila Camargos</option>
                        <option value="marcelle-chaves">Marcelle Chaves</option>
                        <option value="mariana-antunes">Mariana Antunes</option>

                        <option value="weberth-christian">Weberth Christian</option>
                    </select>

                <div class="form-group">
                    <label for="osClienteNome">Nome completo do cliente</label>
                    <input type="text" id="osClienteNome" name="osClienteNome" required>
                </div>

                <div class="form-group">
                    <label for="osEnderecoAntigo">Endereço antigo</label>
                    <input type="text" id="osEnderecoAntigo" name="osEnderecoAntigo" required>
                </div>

                <div class="form-group">
                    <label for="osEnderecoNovo">Novo endereço</label>
                </div>

                <div class="form-group">
                    <label for="osNovoCep">CEP <span style="color: red;">*</span></label>
                    <div class="input-with-button">
                        <input type="text" id="osNovoCep" name="osNovoCep" placeholder="00000-000" required>
                        <button type="button" id="searchNovoCep" class="btn-search">Buscar</button>
                    </div>
                </div>

                <div class="form-group">
                    <label for="osNovoLogradouro">Logradouro</label>
                    <input type="text" id="osNovoLogradouro" name="osNovoLogradouro" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="osNovoNumero">Número</label>
                        <input type="text" id="osNovoNumero" name="osNovoNumero" required>
                    </div>
                    <div class="form-group">
                        <label for="osNovoComplemento">Complemento</label>
                        <input type="text" id="osNovoComplemento" name="osNovoComplemento" required>
                    </div>

                    <input type="text" id="osNovoCidade" name="osNovoCidade" required>
                </div>

                <div class="form-row">
                    <div class="form-group">
                        <label for="osTelefone">Telefone</label>
                        <input type="text" id="osTelefone" name="osTelefone" placeholder="(00) 00000-0000" required>
                    </div>
                    <div class="form-group">
                        <label for="osResponsavel">Responsável</label>
                        <input type="text" id="osResponsavel" name="osResponsavel" required>
                    </div>
                </div>

                <div class="form-group">
                    <label for="osDisponibilidade">Disponibilidade</label>
                    <select id="osDisponibilidade" name="osDisponibilidade" required>
                        <option value="">Selecione...</option>
                        <option value="morning">Manhã</option>
                        <option value="afternoon">Tarde</option>
                        <option value="saturdays">Somente aos Sábados</option>
                        <option value="businessHours">Horário Comercial</option>
                    </select>
                </div>

                <div class="form-group">
                    <label for="osTaxa">Taxa</label>
                    <select id="osTaxa" name="osTaxa" required>
                        <option value="">Selecione...</option>
                        <option value="isento">Renovou para se isentar.</option>
                        <option value="1x-100">1x R$100,00</option>
                        <option value="2x-50">2x R$50,00</option>
                    </select>
                </div>

                <!-- Navigation Buttons -->
                <div class="form-navigation">
                    <div class="nav-buttons">
                        <button type="submit" id="osSubmitBtn" class="btn btn-success" title="Enviar">
                            <img src="../assets/send.svg" alt="Enviar" class="nav-icon">
                        </button>
                    </div>
                    <div class="logo-footer">
                        <button type="button" id="osResetBtn" class="btn btn-primary" title="Limpar Formulário">
                            <img src="../assets/clean.svg" alt="Limpar" class="nav-icon" style="filter: brightness(0) saturate(100%) invert(100%);">
                        </button>
                        <img src="../assets/sonik.png" alt="Sonik Logo" class="logo-bottom">
                    </div>
                </div>
            </div>

            <!-- PAGE 2: MUDANÇA DE PONTO INTERNO -->
